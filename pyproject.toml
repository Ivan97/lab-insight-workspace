[project]
name = "lab-insight-workspace"
version = "0.1.0"
description = "Local-first heterogeneous data analysis workspace"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.24,<5",
  "mcp>=1.12,<2",
  "openpyxl>=3.1,<4",
  "polars>=1.31,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "sqlglot>=27,<30",
  "uvicorn[standard]>=0.35,<1",
  "langchain>=1.3.14",
  "langchain-deepseek>=1.1.0",
  "langchain-openai>=1.4.1",
  "deepagents>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.0,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
